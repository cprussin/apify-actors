 intimate concert, considered the best-reviewed worldwide. Secure your tickets now and elevate your music experience to new heights!</p><p><br></p><h2>About the venue</h2><p>In the heart of SF's famous Golden Gate Park, there’s a charming boathouse mostly known to locals. Every Friday &amp; Saturday we transform it into an intimate, unconventional music venue. Kickstart your day by visiting the best Gold Gate Park has to offer. Our top favorites are the De Young Museum, the Japanese Garden, Academy of Science. End with a scenic cruise around the Blue Heron Lake on a rented paddleboat, perfect date or a group outing!</p><p>Experience this memorable night of live music in a unique setting. You don't want to miss out on this local secret! Book now and get ready to be transported to an unforgettable night of music and beauty in the heart of SF.</p>","alignment":"left","url":null,"alt":null,"caption":null,"imageId":null,"originalUrl":null,"width":null,"height":null,"embedUrl":null},{"type":"image","text":null,"alignment":null,"url":"https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F143643003%2F209717592418%2F1%2Foriginal.20210805-013900?h=740&w=1200&auto=format%2Ccompress&q=75&sharp=10&s=e8c45bf13fd20b67c17d8080c38d9845","alt":"","caption":"","imageId":"143643003","originalUrl":"https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F143643003%2F209717592418%2F1%2Foriginal.20210805-013900?auto=format%2Ccompress&q=75&sharp=10&s=2656bd772965cc8daf9cf1fa012e31fe","width":1200,"height":1800,"embedUrl":null},{"type":"image","text":null,"alignment":null,"url":"https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F143642983%2F209717592418%2F1%2Foriginal.20210805-013850?h=740&w=1200&auto=format%2Ccompress&q=75&sharp=10&s=67230e1fcb863b7b981417bc59b9dc8b","alt":"","caption":"","imageId":"143642983","originalUrl":"https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F143642983%2F209717592418%2F1%2Foriginal.20210805-013850?auto=format%2Ccompress&q=75&s
